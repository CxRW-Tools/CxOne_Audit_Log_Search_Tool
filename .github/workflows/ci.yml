name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest Python with an Ubuntu 26.04 runner build (= the README minimum), and a current one.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  dashboard:
    name: Dashboard tests and build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Committed web/ build is up to date
        run: |
          if ! git diff --quiet -- ../web; then
            echo "::error::web/CxOne_Audit_Log_Dashboard.html is out of date. Run 'cd dashboard && npm run build' and commit the result."
            git diff --stat -- ../web
            exit 1
          fi
